<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClayRoots - Login Demo</title>
    <style>
        body {
            background-color: #faf8f5;
            font-family: system-ui, -apple-system, sans-serif;
            color: #2d2522;
            margin: 0;
            padding: 0;
        }
        .login-box {
            text-align: center;
            max-width: 380px;
            margin: 100px auto;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e8ded4;
            box-shadow: 0 4px 14px rgba(60, 40, 25, 0.08);
        }
        h1 {
            color: #b85d38;
            margin-bottom: 24px;
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0 16px;
            border: 1px solid #d8ccc0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #b85d38;
            box-shadow: 0 0 0 3px rgba(184, 93, 56, 0.2);
        }
        label {
            display: block;
            text-align: left;
            margin-left: 10%;
            font-weight: 500;
            color: #554a43;
            font-size: 0.9rem;
        }
        button {
            background-color: #b85d38;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #984826;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #b85d38;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Login Form</h1>
        <form action="home.html">
            <label for="cssUser">Username:</label>
            <input type="text" id="cssUser" name="username"><br>
            <label for="cssPass">Password:</label>
            <input type="password" id="cssPass" name="password"><br>
            <button type="submit">Submit</button>
        </form>
        <a href="home.html" class="back-link">&larr; Return to ClayRoots Home</a>
    </div>
</body>
</html>
