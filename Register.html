<!doctype html>
<html lang="en">
    <head>
        <title>ClayRoots — Register Account</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <!-- ClayRoots Light & Earthy Theme -->
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-clay sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="home.html">
                        <img
                            src="images/clayroots-logo.svg"
                            class="img-fluid rounded-circle"
                            alt="ClayRoots Logo"
                            height="48"
                            width="48"
                        />
                        <div class="d-inline-flex flex-column lh-1">
                            <span class="brand-name">ClayRoots</span>
                            <span class="brand-sub">Pottery &amp; Crafts</span>
                        </div>
                    </a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavId"
                        aria-controls="collapsibleNavId"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavId">
                        <ul class="navbar-nav me-auto mt-2 mt-lg-0 ms-lg-3">
                            <li class="nav-item">
                                <a class="nav-link" href="home.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="AboutUs.html">About Us</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="ContactUs.html">Contact Us</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="Product.html">Products</a>
                            </li>
                        </ul>
                        <div class="d-flex align-items-center gap-2 my-2 my-lg-0">
                            <a
                                class="btn btn-outline-terracotta"
                                href="Register.html"
                                role="button"
                            >
                                Register
                            </a>
                            <a
                                class="btn btn-terracotta"
                                href="login.html"
                                role="button"
                            >
                                Login
                            </a>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                        <div class="clay-auth-card text-center">
                            <div class="mb-4">
                                <img
                                    src="images/clayroots-logo.svg"
                                    alt="ClayRoots Logo"
                                    width="64"
                                    height="64"
                                    class="mb-2"
                                />
                                <h1 class="h3 fw-bold mb-1">Create an Account</h1>
                                <p class="text-muted small">Join ClayRoots for pottery workshops &amp; exclusive handcrafted releases</p>
                            </div>

                            <form action="login.html" method="get">
                                <div class="form-floating mb-3 text-start">
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="name"
                                        id="regName"
                                        placeholder="Full Name"
                                        required
                                    />
                                    <label for="regName">Full Name</label>
                                </div>
                                <div class="form-floating mb-3 text-start">
                                    <input
                                        type="email"
                                        class="form-control"
                                        name="email"
                                        id="regEmail"
                                        placeholder="name@example.com"
                                        required
                                    />
                                    <label for="regEmail">Email Address</label>
                                </div>
                                <div class="form-floating mb-3 text-start">
                                    <input
                                        type="tel"
                                        class="form-control"
                                        name="phone"
                                        id="regPhone"
                                        placeholder="Phone Number"
                                        required
                                    />
                                    <label for="regPhone">Phone Number</label>
                                </div>
                                <div class="form-floating mb-3 text-start">
                                    <input
                                        type="text"
                                        class="form-control"
                                        name="username"
                                        id="regUsername"
                                        placeholder="Username"
                                        required
                                    />
                                    <label for="regUsername">Username</label>
                                </div>
                                <div class="form-floating mb-4 text-start">
                                    <input
                                        type="password"
                                        class="form-control"
                                        name="password"
                                        id="regPassword"
                                        placeholder="Password"
                                        required
                                    />
                                    <label for="regPassword">Password</label>
                                </div>
                                <div class="d-grid gap-2 mb-3">
                                    <button
                                        type="submit"
                                        class="btn btn-terracotta py-2"
                                    >
                                        Register Now
                                    </button>
                                </div>
                                <div class="text-center text-muted small">
                                    Already have an account? 
                                    <a href="login.html" class="fw-semibold" style="color: var(--cr-primary); text-decoration: none;">
                                        Log in here
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer-clay text-center py-4">
            <div class="container">
                &copy; All Rights Reserved By ClayRoots
            </div>
        </footer>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
        <!-- ClayRoots Main JS -->
        <script src="js/main.js"></script>
    </body>
</html>
